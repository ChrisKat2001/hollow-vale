<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hollow Vale</title>
<meta name="theme-color" content="#0d0b0e">
<meta name="description" content="Learn data analysis in R through a fantasy tabletop campaign.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hollow Vale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a 1983 basement table. Wood-dark, candle-gold, neon-red title, amber terminal. */
  --bg: #0d0b0e;
  --panel: #17131a;
  --paper: #e9dfc7;
  --ink: #e6dccb;
  --muted: #9b8f80;
  --neon: #ff3b30;
  --gold: #d9a441;
  --amber: #ffb648;
  --line: #2c2530;
  --good: #7fc97f;
  --bad: #ff6b5e;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --term: "VT323", "Courier New", monospace;
  --code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* Layout: story column on the left, character sheet + spellbook pinned on the right. */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,59,48,.10), transparent 60%),
    radial-gradient(ellipse at 90% 100%, rgba(217,164,65,.07), transparent 50%),
    var(--bg);
  min-height: 100vh;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header {
  padding: 28px 20px 18px;
  text-align: left;
  max-width: 1240px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.eyebrow { font-family: var(--term); color: var(--muted); font-size: 20px; letter-spacing: .08em; }
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(38px, 6vw, 68px);
  line-height: 1;
  margin: 4px 0 0;
  color: #ffd9d4;
  letter-spacing: .02em;
  text-shadow: 0 0 6px rgba(255,59,48,.9), 0 0 22px rgba(255,59,48,.55), 0 0 48px rgba(255,59,48,.3);
  text-wrap: balance;
}
.status {
  font-family: var(--term); font-size: 20px; color: var(--amber);
  border: 1px solid var(--line); padding: 4px 12px; border-radius: 4px; background: #0a0809;
}
.status.ready { color: var(--good); }

main {
  max-width: 1240px; margin: 0 auto; padding: 0 20px 60px;
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start;
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }

/* Quest track */
.track { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.track span {
  font-family: var(--term); font-size: 18px; padding: 2px 10px; border-radius: 3px;
  border: 1px solid var(--line); color: var(--muted);
}
.track span.done { color: var(--gold); border-color: #5a4520; }
.track span.now { color: #fff; border-color: var(--neon); box-shadow: 0 0 10px rgba(255,59,48,.35); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px; }
.card + .card { margin-top: 18px; }

.dm-label { font-family: var(--term); color: var(--neon); font-size: 20px; letter-spacing: .06em; }
.chapter { font-family: var(--display); font-size: 32px; margin: 2px 0 10px; color: var(--paper); font-weight: 400; text-wrap: balance; }
.narration p { margin: 0 0 12px; max-width: 66ch; }
.narration em { color: var(--paper); }
.task {
  border-left: 3px solid var(--gold); padding: 10px 14px; margin: 14px 0 4px;
  background: rgba(217,164,65,.06); max-width: 70ch;
}
.task b { font-family: var(--display); font-weight: 400; color: var(--gold); letter-spacing: .03em; }
code, .inline { font-family: var(--code); font-size: 15px; background: #0a0809; padding: 1px 5px; border-radius: 3px; color: var(--amber); }

/* Enemy */
.enemy { display: flex; gap: 16px; align-items: center; border: 1px dashed #5a2522; border-radius: 6px; padding: 12px 14px; margin: 14px 0; background: rgba(255,59,48,.04); }
.enemy canvas { flex: none; }
.enemy-name { font-family: var(--display); font-size: 22px; color: var(--bad); }
.hp { height: 10px; background: #2a1414; border-radius: 5px; overflow: hidden; margin-top: 6px; width: 220px; max-width: 100%; }
.hp > div { height: 100%; background: linear-gradient(90deg, #a51f17, var(--neon)); transition: width .8s ease; }
.enemy small { font-family: var(--term); color: var(--muted); font-size: 18px; }

/* Predict */
.choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.choice {
  background: #0f0c11; color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
  padding: 8px 14px; font-family: var(--code); font-size: 15px;
}
.choice:hover { border-color: var(--gold); }
.choice.picked { border-color: var(--gold); color: var(--gold); }

/* Editor */
.editor-wrap { margin-top: 14px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #08070a; }
.editor-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-family: var(--term); font-size: 18px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
textarea#code {
  width: 100%; min-height: 170px; resize: vertical; border: 0; outline: none;
  background: #08070a; color: #f3e9d6; font-family: var(--code); font-size: 15px; line-height: 1.6;
  padding: 12px 14px; tab-size: 4;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px; border-top: 1px solid var(--line); }
.btn {
  border: 1px solid var(--gold); color: var(--bg); background: var(--gold);
  padding: 7px 16px; border-radius: 4px; font-family: var(--display); font-size: 18px; letter-spacing: .03em;
}
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--gold); }
.btn.red { background: var(--neon); border-color: var(--neon); color: #fff; }
pre.out {
  margin: 0; padding: 12px 14px; border-top: 1px solid var(--line); background: #050405;
  font-family: var(--term); font-size: 19px; line-height: 1.25; color: var(--amber);
  white-space: pre; overflow-x: auto; max-height: 320px; overflow-y: auto; min-height: 44px;
}
pre.out.err { white-space: pre-wrap; }
@media (max-width: 500px) { pre.out { font-size: 16px; } textarea#code { font-size: 14px; } }
pre.out.err { color: var(--bad); }
.verdict { margin-top: 12px; padding: 12px 14px; border-radius: 6px; font-size: 17px; display: none; }
.verdict.show { display: block; }
.verdict.ok { border: 1px solid #3b5f3b; background: rgba(127,201,127,.08); }
.verdict.no { border: 1px solid #6a2a25; background: rgba(255,107,94,.07); }
.lesson { margin-top: 10px; font-size: 16px; color: var(--muted); }
.lesson b { color: var(--paper); font-weight: 400; font-family: var(--display); }

/* Character creation */
.create { display: grid; gap: 14px; margin-top: 10px; }
.create label { font-family: var(--term); font-size: 20px; color: var(--muted); }
.create input {
  width: 100%; max-width: 360px; background: #0a0809; border: 1px solid var(--line); color: var(--paper);
  font-family: var(--display); font-size: 22px; padding: 8px 12px; border-radius: 4px;
}
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.cls { text-align: left; background: #0f0c11; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
.cls:hover { border-color: #6b5530; }
.cls.picked { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.cls strong { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--gold); }
.cls span { font-size: 15px; color: var(--muted); }

/* Sidebar */
aside { position: sticky; top: 16px; display: grid; gap: 18px; }
@media (max-width: 900px) { aside { position: static; } }
.sheet {
  background-color: var(--paper); color: #2b2218;
  background-image:
    linear-gradient(rgba(70,110,160,.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70,110,160,.18) 1px, transparent 1px);
  background-size: 16px 16px;
  border-radius: 4px; padding: 16px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  transform: rotate(-.6deg);
}
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.sheet .sub { font-family: var(--term); font-size: 19px; color: #6a5a48; margin-bottom: 8px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.stat { border: 1.5px solid #2b2218; border-radius: 4px; padding: 4px 8px; background: rgba(255,255,255,.35); }
.stat small { display: block; font-family: var(--term); font-size: 16px; color: #6a5a48; text-transform: uppercase; letter-spacing: .05em; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.xpbar { height: 10px; border: 1.5px solid #2b2218; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.4); }
.xpbar > div { height: 100%; background: #8a2a1e; transition: width .6s ease; }
.xptext { font-family: var(--term); font-size: 18px; display: flex; justify-content: space-between; margin-top: 3px; }

.dice { text-align: center; }
.dice canvas { display: block; margin: 4px auto 8px; }
.dice .roll-result { font-family: var(--term); font-size: 20px; color: var(--amber); min-height: 26px; }
.dice .log { font-family: var(--term); font-size: 17px; color: var(--muted); margin-top: 6px; }
.hintbox { text-align: left; margin-top: 10px; font-size: 16px; padding: 10px 12px; border: 1px solid #5a4520; border-radius: 4px; background: rgba(217,164,65,.07); display: none; }
.hintbox.show { display: block; }

.spellbook h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--gold); }
.spellbook .sub { font-size: 15px; color: var(--muted); margin-bottom: 10px; }
.spell { border-top: 1px solid var(--line); padding: 9px 0; }
.spell .sig { font-family: var(--code); font-size: 14px; color: var(--amber); word-break: break-word; }
.spell .what { font-size: 15px; color: var(--ink); }
.spell .ex { font-family: var(--code); font-size: 13px; color: var(--muted); }
.spell.locked { opacity: .38; }
.spell.locked .sig::after { content: "  · not yet learned"; font-family: var(--term); color: var(--muted); font-size: 16px; }
.spell.fresh .sig { text-shadow: 0 0 8px rgba(255,182,72,.6); }
.spellbook .scroll { max-height: 420px; overflow-y: auto; padding-right: 4px; }

.reveal { font-family: var(--term); font-size: 20px; color: var(--paper); margin-top: 8px; }
.levelup {
  position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(.9);
  font-family: var(--display); font-size: clamp(30px, 6vw, 56px); color: #ffe7a8; pointer-events: none;
  text-shadow: 0 0 12px rgba(217,164,65,.9), 0 0 40px rgba(217,164,65,.5);
  opacity: 0; transition: opacity .4s, transform .4s; z-index: 10; white-space: nowrap;
}
.levelup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.reset { background: none; border: 0; color: var(--muted); font-family: var(--term); font-size: 18px; text-decoration: underline; padding: 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Campaign map ---------- */
.mapcard { padding: 0; overflow: hidden; }
.maphead { padding: 18px 22px 6px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.maphead .chapter { margin: 0; }
.mapwrap {
  margin: 0 14px 14px; border-radius: 6px; overflow: hidden; position: relative;
  background: #d9c9a3;
  box-shadow: inset 0 0 60px rgba(80,50,20,.55), inset 0 0 8px rgba(80,50,20,.6);
}
.mapwrap svg { display: block; width: 100%; height: auto; }
.node { cursor: pointer; }
.node:focus { outline: none; }
.node:focus-visible .ring { stroke: #1f5fbf; stroke-width: 4; }
.node .ring { fill: #f3e6c4; stroke: #3b2a1a; stroke-width: 3; transition: transform .2s; }
.node.open .ring { fill: #ffe2dc; stroke: #b3241b; }
.node.done .ring { fill: #f6e2a6; stroke: #8a6418; }
.node.locked { cursor: default; }
.node.locked .ring { fill: #cbbd9c; stroke: #8b7a5c; stroke-dasharray: 4 3; }
.node .num { font-family: var(--display); font-size: 24px; fill: #3b2a1a; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node.locked .num { fill: #8b7a5c; }
.node .lbl { font-family: var(--display); font-size: 21px; fill: #2b1d10; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(230,214,176,.9); stroke-width: 5px; }
.node.locked .lbl { fill: #7d6c50; }
.node .sublbl { font-family: var(--term); font-size: 17px; fill: #5c4630; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(230,214,176,.9); stroke-width: 4px; }
.node.open .pulse { fill: none; stroke: #e0372c; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
.maptitle { font-family: var(--display); fill: #3b2a1a; font-size: 34px; letter-spacing: .06em; }
.mapnote { font-family: var(--body); font-style: italic; fill: #5c4630; font-size: 16px; }

.sessions { display: grid; gap: 10px; padding: 0 14px 16px; }
.sess {
  display: flex; gap: 14px; align-items: center; text-align: left; width: 100%;
  background: #0f0c11; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
}
.sess:not(:disabled):hover { border-color: var(--gold); }
.sess:disabled { opacity: .5; cursor: default; }
.sess .badge { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 20px; border: 2px solid var(--line); }
.sess.done .badge { border-color: var(--gold); color: var(--gold); }
.sess.open .badge { border-color: var(--neon); color: #fff; box-shadow: 0 0 10px rgba(255,59,48,.4); }
.sess strong { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--paper); }
.sess span { font-size: 15px; color: var(--muted); }
.sess .state { margin-left: auto; font-family: var(--term); font-size: 18px; color: var(--muted); white-space: nowrap; }
.sess.done .state { color: var(--gold); }
.sess.open .state { color: var(--neon); }

.backlink { background: none; border: 1px solid var(--line); color: var(--gold); font-family: var(--term); font-size: 18px; padding: 2px 10px; border-radius: 3px; }
.backlink:hover { border-color: var(--gold); }

/* ---------- Visions (R plots) ---------- */
.visions { display: grid; gap: 10px; padding: 10px; border-top: 1px solid var(--line); background: #050405; }
.visions:empty { display: none; }
.vision { background: var(--paper); padding: 8px; border-radius: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
.vision canvas { display: block; width: 100%; height: auto; }
.vision small { display: block; font-family: var(--term); font-size: 16px; color: #6a5a48; margin-top: 4px; }
.spellgroup { font-family: var(--term); font-size: 17px; color: var(--muted); letter-spacing: .06em; margin: 12px 0 2px; }
@media (max-width: 700px) {
  .mapwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .mapwrap svg { width: 760px; max-width: none; }
  .maphint { display: block; }
}
.maphint { display: none; font-family: var(--term); font-size: 17px; color: var(--muted); padding: 0 16px 8px; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
/* ---------- General spellbook ---------- */
.spellsearch { width: 100%; background: #0a0809; border: 1px solid var(--line); color: var(--paper); font-family: var(--code); font-size: 15px; padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; }
.spellsearch::placeholder { color: var(--muted); }
.spellcat { border-top: 1px solid var(--line); }
.spellcat summary { cursor: pointer; padding: 9px 2px; font-family: var(--display); font-size: 19px; color: var(--paper); list-style: none; display: flex; justify-content: space-between; align-items: center; }
.spellcat summary::-webkit-details-marker { display: none; }
.spellcat summary::before { content: "▸"; color: var(--gold); margin-right: 8px; transition: transform .15s; }
.spellcat[open] summary::before { transform: rotate(90deg); }
.spellcat summary span { margin-left: auto; font-family: var(--term); font-size: 17px; color: var(--muted); }
.spellcat .spell { border-top: 1px dashed #2a232e; padding: 8px 0 8px 16px; }
.spellbook .scroll { max-height: 520px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.maptip { margin: 0 14px 12px; padding: 10px 14px; border-left: 3px solid var(--neon); background: rgba(255,59,48,.07); font-size: 16px; }
.maptip b { font-family: var(--display); font-weight: 400; color: var(--paper); }
/* ---------- Tiered hints ---------- */
.hints { margin-top: 12px; display: grid; gap: 8px; max-width: 70ch; }
.hints-head { display: flex; align-items: center; gap: 10px; }
.hints-head .dm-label { font-size: 18px; }
.hint-dots { display: inline-flex; gap: 5px; }
.hint-dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold); display: inline-block; }
.hint-dots i.on { background: var(--gold); }
.hint { font-size: 16px; padding: 8px 12px; border: 1px solid #5a4520; border-radius: 4px; background: rgba(217,164,65,.06); }
.hint b { font-family: var(--display); font-weight: 400; color: var(--gold); }
.reveal-box { border-color: #6a2a25; background: rgba(255,59,48,.06); display: grid; gap: 8px; }
.reveal-box b { color: var(--bad); }
.reveal-box pre { margin: 0; font-family: var(--code); font-size: 14px; color: var(--amber); background: #08070a; padding: 10px 12px; border-radius: 4px; overflow-x: auto; white-space: pre; }
.reveal-box .btn { justify-self: start; }
.hint-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.small { font-size: 16px; padding: 5px 12px; }
.btn.warn { color: var(--bad); border-color: #6a2a25; }
.hint-note { font-family: var(--term); font-size: 17px; color: var(--muted); min-height: 0; }
.hint-note:empty { display: none; }
/* ---------- Feedback form ---------- */
.fbcard { margin-top: 18px; border-color: #5a4520; }
.fbintro, .fbdone { margin: 0 0 12px; font-size: 16px; color: var(--muted); max-width: 66ch; }
.fbdone { color: var(--good); }
.fbform { display: grid; gap: 14px; }
.fbform fieldset { border: 0; padding: 0; margin: 0; }
.fbform legend, .fbform label { font-family: var(--term); font-size: 19px; color: var(--paper); margin-bottom: 4px; padding: 0; }
.fbform .choices { margin: 6px 0 0; }
.fbform textarea { width: 100%; background: #0a0809; border: 1px solid var(--line); color: var(--paper); font-family: var(--body); font-size: 16px; padding: 8px 10px; border-radius: 4px; resize: vertical; }
.fbstatus { align-self: center; font-size: 16px; color: var(--muted); }
/* ---------- Interpretation questions ---------- */
.interp { margin-top: 14px; border-color: #5a4520; }
.interp.done { border-color: #3b5f3b; }
.interp .iq { font-size: 18px; margin: 6px 0 12px; max-width: 66ch; color: var(--paper); }
.iopts { display: grid; gap: 8px; }
.iopt { text-align: left; background: #0f0c11; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 16px; display: grid; gap: 6px; }
.iopt:not(:disabled):hover { border-color: var(--gold); }
.iopt:disabled { cursor: default; }
.iopt.right { border-color: #3b5f3b; background: rgba(127,201,127,.08); }
.iopt.wrong { border-color: #6a2a25; background: rgba(255,107,94,.06); }
.iopt small { font-size: 15px; color: var(--muted); }
.iopt.right small { color: var(--good); }
.iresult { margin-top: 10px; font-family: var(--term); font-size: 18px; color: var(--good); }
.iresult.muted { color: var(--muted); }
/* ---------- Pixel art ---------- */
canvas.portrait, canvas.heroart, canvas.clsart, #enemyArt { image-rendering: pixelated; image-rendering: crisp-edges; }
.chead { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
.chead .chapter { margin-bottom: 2px; }
.portrait { flex: none; width: 64px; height: 64px; background: #0f0c11; border: 2px solid #5a4520; border-radius: 6px; padding: 2px; box-shadow: 0 0 0 1px #000 inset; }

<script>
const R_SETUP = String.raw`## ---------- Shared helpers (run once at boot) ----------
options(width = 70)
G <- new.env(parent = globalenv())

.friendly <- function(msg) {
  tip <- "Something went wrong. Read the message above."
  if (grepl("not found", msg) && grepl("object", msg)) tip <- "The DM doesn't know that name. Check spelling, or run the earlier step first."
  else if (grepl("could not find function", msg)) tip <- "That spell doesn't exist. Check the spellbook for the exact name."
  else if (grepl("undefined columns|subscript out of bounds", msg)) tip <- "That column doesn't exist. Column names are case-sensitive."
  else if (grepl("unexpected|parse", msg)) tip <- "The incantation is malformed. R points at where it got confused, but the mistake is often on the line just above. Check brackets, quotes and commas."
  else if (grepl("non-numeric|invalid 'type'", msg)) tip <- "A spell got the wrong kind of ingredient."
  paste0("Error: ", msg, "\n-> ", tip)
}

.theme <- function() {
  par(bg = "#efe6cf", fg = "#3b2a1a", col = "#3b2a1a", col.axis = "#5c4630", col.lab = "#3b2a1a",
      col.main = "#7a2418", col.sub = "#5c4630", family = "serif", font.main = 1, cex.main = 1.35,
      cex.lab = 1.1, cex.axis = 0.95, las = 1, bty = "l", tcl = -0.3, mgp = c(2.6, 0.6, 0),
      mar = c(4.2, 4.4, 3.2, 1.2))
  palette(c("#7a2418", "#d9a441", "#3e6b5a", "#4a5a8a", "#8a5a2a", "#6b4a7a", "#3b2a1a", "#a8743a"))
  invisible(NULL)
}
.run <- function(src) {
  out <- character(0); ok <- TRUE
  if (dev.cur() > 1) try(.theme(), silent = TRUE)
  exprs <- tryCatch(parse(text = src, keep.source = TRUE), error = function(e) e)
  if (inherits(exprs, "error")) {
    m <- conditionMessage(exprs)
    ln <- suppressWarnings(as.integer(sub("^<text>:(\\d+):.*", "\\1", strsplit(m, "\n")[[1]][1])))
    return(paste0("0\x01", .friendly(m), if (!is.na(ln)) paste0("\x02", ln) else ""))
  }
  refs <- attr(exprs, "srcref")
  for (k in seq_along(exprs)) {
    e <- exprs[[k]]
    res <- tryCatch({
      o <- capture.output(withCallingHandlers({
        v <- withVisible(eval(e, G))
        if (v$visible) print(v$value)
      }, warning = function(w) { cat("Warning:", conditionMessage(w), "\n"); invokeRestart("muffleWarning") }))
      list(ok = TRUE, o = o)
    }, error = function(err) list(ok = FALSE, o = .friendly(conditionMessage(err))))
    out <- c(out, res$o)
    if (!res$ok) {
      ok <- FALSE
      ln <- if (!is.null(refs) && length(refs) >= k) refs[[k]][1] else NA
      if (!is.na(ln)) return(paste0("0\x01", paste(out, collapse = "\n"), "\x02", ln))
      break
    }
  }
  paste0(if (ok) "1" else "0", "\x01", paste(out, collapse = "\n"))
}

.frames <- function() {
  n <- ls(G)
  n <- n[vapply(n, function(x) is.data.frame(get(x, envir = G)), logical(1))]
  paste(n, collapse = ",")
}
.peek <- function(name, max_rows = 500) {
  d <- get(name, envir = G)
  types <- vapply(d, function(col) if (is.factor(col)) "factor" else if (is.numeric(col)) "num" else if (is.logical(col)) "lgl" else "chr", character(1))
  h <- utils::head(d, max_rows)
  cells <- vapply(h, function(col) { v <- if (is.numeric(col)) format(col, digits = 4, trim = TRUE) else as.character(col); v[is.na(col)] <- "NA"; v }, character(nrow(h)))
  if (is.null(dim(cells))) cells <- matrix(cells, nrow = nrow(h))
  rows <- apply(cells, 1, function(r) paste(gsub("[\t\n]", " ", r), collapse = "\t"))
  paste(c(nrow(d), paste(names(d), collapse = "\t"), paste(types, collapse = "\t"), rows), collapse = "\n")
}

.say <- function(ok, msg) paste0(if (ok) "1" else "0", "\x01", msg)
.has <- function(name) exists(name, envir = G, inherits = FALSE)
.fields <- c("Ashgrove" = 0.4, "Briar Hollow" = 3.1, "Cinderfen" = 0.8, "Dunmere" = 5.2,
             "Elderbrook" = 2.3, "Foxmeadow" = 6.1, "Gallows End" = 1.5, "Hearthstone" = 4.4)

## ---------- Session 1: The Blighted Harvest ----------
.setup_s1 <- function() {
  G <<- new.env(parent = globalenv())
  set.seed(1983)
  n <- 6 * length(.fields)
  df <- data.frame(year = rep(1978:1983, each = length(.fields)),
                   field = rep(names(.fields), 6), stringsAsFactors = FALSE)
  df$rainfall_mm <- round(rnorm(n, 700, 90), 1)
  df$soil_ph <- round(rnorm(n, 6.5, 0.35), 2)
  df$mill_distance_km <- unname(.fields[df$field])
  df$yield_bushels <- round(38 + 7.5 * df$mill_distance_km + 0.012 * (df$rainfall_mm - 700) + rnorm(n, 0, 4), 1)
  .MISS <<- sort(sample(n, 6))
  df$rainfall_mm[.MISS] <- NA
  .ORIG <<- df
  assign("df", df, envir = G)
  invisible(TRUE)
}

.s1c1 <- function() {
  if (!.has("n_records")) return(.say(FALSE, "I don't see a variable called n_records yet."))
  n <- G$n_records
  if (!is.numeric(n) || length(n) != 1 || n != nrow(.ORIG))
    return(.say(FALSE, paste0("n_records is ", paste(format(n), collapse = " "), ". The ledger has more entries than that. Count every row of df.")))
  .say(TRUE, sprintf("The ledger holds %d entries: 8 fields over 6 years (1978-1983).", nrow(.ORIG)))
}
.s1c2 <- function() {
  if (!.has("clean")) return(.say(FALSE, "Store your repaired ledger in a variable called clean."))
  cl <- G$clean
  if (!is.data.frame(cl)) return(.say(FALSE, "clean should be a data frame."))
  if (nrow(cl) < nrow(.ORIG)) return(.say(FALSE, sprintf("The goblin laughs. You dropped rows and now clean has only %d of %d entries. Fill the gaps instead of throwing records away.", nrow(cl), nrow(.ORIG))))
  if (any(is.na(cl$rainfall_mm))) return(.say(FALSE, sprintf("%d gaps remain in rainfall_mm.", sum(is.na(cl$rainfall_mm)))))
  med <- median(.ORIG$rainfall_mm, na.rm = TRUE)
  if (!isTRUE(all.equal(cl$rainfall_mm[.MISS], rep(med, length(.MISS)))))
    return(.say(FALSE, sprintf("The gaps are filled, but not with the median (%.1f). Use median() with na.rm = TRUE.", med)))
  .say(TRUE, sprintf("All 6 gaps filled with the median rainfall, %.1f mm. The goblin is vanquished.", med))
}
.s1c3 <- function() {
  if (!.has("worst_field")) return(.say(FALSE, "Store the name of the weakest field in worst_field."))
  w <- G$worst_field
  avg <- tapply(G$clean$yield_bushels, G$clean$field, mean)
  exp <- names(which.min(avg))
  if (is.numeric(w)) return(.say(FALSE, "worst_field is a number, not a name. Wrap which.min() in names()."))
  if (length(w) != 1) return(.say(FALSE, "worst_field should be a single name, not a whole table."))
  if (!identical(unname(as.character(w)), exp)) return(.say(FALSE, paste0("'", w, "' is not the weakest field. Look again at the averages.")))
  .say(TRUE, sprintf("%s averages only %.1f bushels. The best field, %s, averages %.1f.", exp, min(avg), names(which.max(avg)), max(avg)))
}
.s1c4 <- function() {
  if (!.has("corrs")) return(.say(FALSE, "Store the correlations in a variable called corrs."))
  s <- G$corrs
  nums <- G$clean[sapply(G$clean, is.numeric)]
  exp <- cor(nums)[, "yield_bushels"]
  if (!is.numeric(s) || is.null(names(s))) return(.say(FALSE, "corrs should be one named column of the correlation matrix. Pick [, \"yield_bushels\"]."))
  if (!setequal(names(s), names(exp)) || !isTRUE(all.equal(unname(s[names(exp)]), unname(exp))))
    return(.say(FALSE, "Those numbers don't match the correlations of yield_bushels with the other columns."))
  .say(TRUE, "The Oracle's stone glows. Each number shows how strongly a column moves with the harvest.")
}
.s1c5 <- function() {
  if (!.has("culprit")) return(.say(FALSE, "Name the culprit column in a variable called culprit."))
  cc <- G$culprit
  nums <- G$clean[sapply(G$clean, is.numeric)]
  corr <- cor(nums)[, "yield_bushels"]
  corr <- corr[!names(corr) %in% c("yield_bushels", "year")]
  exp <- names(which.max(abs(corr)))
  if (identical(cc, "rainfall_mm")) return(.say(FALSE, "Rainfall is a red herring. Its correlation is weak. Look for the strongest link, positive or negative."))
  if (!identical(unname(as.character(cc)), exp)) return(.say(FALSE, paste0("'", paste(cc, collapse = " "), "' is not the strongest link. Compare the absolute values.")))
  .say(TRUE, sprintf("%s has a correlation of %.2f with the harvest. The fields closest to the Old Mill fail the most.", exp, corr[[exp]]))
}

## ---------- Session 2: Trial at the Old Mill ----------
.setup_s2 <- function() {
  G <<- new.env(parent = globalenv())
  set.seed(1972)
  years <- 1972:1983
  ledger <- data.frame(year = rep(years, each = length(.fields)),
                       field = rep(names(.fields), length(years)), stringsAsFactors = FALSE)
  n <- nrow(ledger)
  ledger$mill_distance_km <- unname(.fields[ledger$field])
  ledger$rainfall_mm <- round(rnorm(n, 700, 90), 1)
  after <- ledger$year >= 1978
  shadow <- 45 * exp(-ledger$mill_distance_km / 1.2)
  base <- 78 + 1 * ledger$mill_distance_km - ifelse(after, shadow, 0)
  ledger$yield_bushels <- round(base + 0.012 * (ledger$rainfall_mm - 700) + rnorm(n, 0, 4), 1)
  .LEDGER <<- ledger
  dist <- round(runif(24, 0.3, 1.5), 1)
  grp <- sample(rep(c("diverted", "control"), 12))
  trial <- data.frame(plot = sprintf("P%02d", 1:24), mill_distance_km = dist, group = grp, stringsAsFactors = FALSE)
  trial$yield_bushels <- round(78 + dist - ifelse(grp == "diverted", 0.2, 1) * 45 * exp(-dist / 1.2) + rnorm(24, 0, 6), 1)
  .TRIAL <<- trial
  assign("ledger", ledger, envir = G)
  assign("trial", trial, envir = G)
  invisible(TRUE)
}

.s2c1 <- function(nimg) {
  src <- if (exists(".src")) .src else ""
  if (nimg < 1) return(.say(FALSE, "No vision appeared. Use plot() to draw the ledger."))
  if (!grepl("mill_distance_km", src) || !grepl("yield_bushels", src))
    return(.say(FALSE, "You drew something, but the Seer asked for yield_bushels against mill_distance_km."))
  .say(TRUE, "The vision shows a rising cloud. Further from the mill, bigger harvests. But look closer. Some near fields once did well.")
}
.s2c2 <- function() {
  L <- G$ledger
  if (is.null(L$period)) return(.say(FALSE, "Add a column called period to ledger."))
  if (is.null(L$zone)) return(.say(FALSE, "Add a column called zone to ledger."))
  ep <- ifelse(.LEDGER$year < 1978, "before", "after")
  ez <- ifelse(.LEDGER$mill_distance_km < 2, "near", "far")
  if (!identical(as.character(L$period), ep)) return(.say(FALSE, "period is not right. Years before 1978 are \"before\", the rest are \"after\"."))
  if (!identical(as.character(L$zone), ez)) return(.say(FALSE, "zone is not right. Fields under 2 km from the mill are \"near\", the rest are \"far\"."))
  .say(TRUE, sprintf("Every entry is tagged. %d near and %d far entries, split around 1978, the year the mill woke.", sum(ez == "near"), sum(ez == "far")))
}
.s2c3 <- function() {
  if (!.has("means")) return(.say(FALSE, "Store the table of averages in a variable called means."))
  m <- G$means
  L <- G$ledger
  exp <- tapply(L$yield_bushels, list(L$zone, L$period), mean)
  if (!is.matrix(m) || !all(dim(m) == c(2, 2))) return(.say(FALSE, "means should be a 2 x 2 table: zone by period. Pass both columns to tapply() inside list()."))
  if (!isTRUE(all.equal(m[rownames(exp), colnames(exp)], exp, check.attributes = FALSE)))
    return(.say(FALSE, "Those averages don't match. Use list(ledger$zone, ledger$period) as the groups."))
  dn <- exp["near", "after"] - exp["near", "before"]
  df <- exp["far", "after"] - exp["far", "before"]
  .say(TRUE, sprintf("Near fields changed by %+.1f bushels after 1978. Far fields changed by %+.1f. The gap between those, %.1f, is the mill's shadow.", dn, df, dn - df))
}
.s2c4 <- function() {
  if (!.has("p_value")) return(.say(FALSE, "Store the p-value in a variable called p_value."))
  p <- G$p_value
  exp <- t.test(yield_bushels ~ group, data = .TRIAL)$p.value
  if (!is.numeric(p) || length(p) != 1) return(.say(FALSE, "p_value should be one number. Take it from result$p.value."))
  if (!isTRUE(all.equal(p, exp))) return(.say(FALSE, "That number isn't the p-value of the t-test on trial. Compare yield_bushels by group."))
  .say(TRUE, sprintf("p = %s. If the stream made no difference, a gap this large would almost never happen by luck.", format.pval(exp, digits = 2)))
}
.s2c5 <- function() {
  if (!.has("effect")) return(.say(FALSE, "Store the difference in a variable called effect."))
  if (!.has("verdict")) return(.say(FALSE, "Store your ruling in a variable called verdict."))
  e <- G$effect; v <- G$verdict
  exp <- mean(.TRIAL$yield_bushels[.TRIAL$group == "diverted"]) - mean(.TRIAL$yield_bushels[.TRIAL$group == "control"])
  if (!is.numeric(e) || !isTRUE(all.equal(e, exp))) {
    if (is.numeric(e) && isTRUE(all.equal(e, -exp))) return(.say(FALSE, "Right size, wrong sign. Subtract control from diverted."))
    return(.say(FALSE, "effect should be the mean of diverted plots minus the mean of control plots."))
  }
  if (identical(v, "luck")) return(.say(FALSE, "The Rotwarden grins. But your p-value is far below 0.05. Luck is not a good explanation here."))
  if (!identical(v, "mill")) return(.say(FALSE, "verdict should be \"mill\" or \"luck\"."))
  .say(TRUE, sprintf("Diverted plots grew %.1f more bushels on average. The trial was random, so the mill is the cause.", exp))
}

.check <- function(session, step, nimg = 0) {
  f <- get0(sprintf(".%sc%d", session, step))
  if (is.null(f)) return(.say(FALSE, "No check for this step."))
  tryCatch(if ("nimg" %in% names(formals(f))) f(nimg) else f(),
           error = function(e) .say(FALSE, paste("The check itself stumbled:", conditionMessage(e))))
}

## ---------- Session 3: The Vanishing Customers (Merchant's Port) ----------
.setup_s3 <- function() {
  G <<- new.env(parent = globalenv())
  set.seed(1984)
  n <- 400
  guild <- data.frame(customer_id = sprintf("C%03d", 1:n), stringsAsFactors = FALSE)
  guild$district <- sample(c("Docks", "Market", "Hill"), n, replace = TRUE, prob = c(0.4, 0.35, 0.25))
  guild$tenure_months <- round(rgamma(n, shape = 2, scale = 10))
  guild$visits <- rpois(n, 6)
  guild$avg_spend <- round(rlnorm(n, log(40), 0.4), 1)
  guild$complaints <- rpois(n, 0.7)
  guild$loyalty <- sample(c("yes", "no"), n, replace = TRUE, prob = c(0.45, 0.55))
  lp <- 0.9 - 0.04 * guild$tenure_months - 0.28 * guild$visits + 0.75 * guild$complaints -
        1.0 * (guild$loyalty == "yes") + 0.3 * (guild$district == "Docks")
  guild$left <- rbinom(n, 1, plogis(lp))
  .GUILD <<- guild
  assign("guild", guild, envir = G)
  invisible(TRUE)
}
.s3model <- function() glm(left ~ visits + complaints + loyalty + tenure_months, family = binomial, data = .GUILD)

.s3c1 <- function() {
  r <- .num1("churn_rate", mean(.GUILD$left), "The mean of a 0/1 column is the share of 1s. Use mean() on guild$left.")
  if (!is.null(r)) return(r)
  if (!.has("rate_by_seal")) return(.say(FALSE, "Store the churn rate per loyalty group in rate_by_seal."))
  exp <- tapply(.GUILD$left, .GUILD$loyalty, mean)
  v <- G$rate_by_seal
  if (is.null(names(v)) || !setequal(names(v), names(exp)) || !isTRUE(all.equal(as.numeric(v[names(exp)]), as.numeric(exp))))
    return(.say(FALSE, "rate_by_seal should hold the mean of left for each loyalty group. Group by guild$loyalty."))
  .say(TRUE, sprintf("%.0f%% of customers left last season. Without a loyalty seal: %.0f%%. With one: %.0f%%.", 100 * mean(.GUILD$left), 100 * exp[["no"]], 100 * exp[["yes"]]))
}
.s3c2 <- function(nimg) {
  if (nimg < 1) return(.say(FALSE, "No vision appeared. Draw a boxplot of visits by left."))
  if (!.has("mean_visits")) return(.say(FALSE, "Store the average visits for stayers and leavers in mean_visits."))
  exp <- tapply(.GUILD$visits, .GUILD$left, mean)
  v <- G$mean_visits
  if (length(v) != 2 || !isTRUE(all.equal(as.numeric(v), as.numeric(exp))))
    return(.say(FALSE, "mean_visits should be the mean of visits for each value of left."))
  .say(TRUE, sprintf("Stayers visited %.1f times on average. Leavers only %.1f. People drift away before they leave.", exp[["0"]], exp[["1"]]))
}
.s3c3 <- function() {
  if (!.has("model")) return(.say(FALSE, "Store your model in a variable called model."))
  m <- G$model
  if (!inherits(m, "glm")) return(.say(FALSE, "model should come from glm()."))
  if (m$family$family != "binomial") return(.say(FALSE, "For a yes/no outcome, use family = binomial."))
  need <- c("visits", "complaints", "loyalty", "tenure_months")
  have <- attr(terms(m), "term.labels")
  miss <- setdiff(need, have)
  if (length(miss)) return(.say(FALSE, paste0("The model is missing: ", paste(miss, collapse = ", "), ".")))
  if (as.character(formula(m))[2] != "left") return(.say(FALSE, "The outcome on the left of ~ should be left."))
  .say(TRUE, "The Augur's model is ready. Each coefficient shows how a trait shifts the log-odds of leaving.")
}
.s3c4 <- function() {
  if (!.has("odds")) return(.say(FALSE, "Store the odds ratios in a variable called odds."))
  m <- .s3model()
  exp_odds <- exp(coef(m))
  o <- G$odds
  if (is.null(names(o)) || !all(names(exp_odds) %in% names(o)) || !isTRUE(all.equal(as.numeric(o[names(exp_odds)]), as.numeric(exp_odds), tolerance = 1e-6)))
    return(.say(FALSE, "odds should be exp() of the model's coefficients."))
  if (!.has("worst")) return(.say(FALSE, "Store the name of the trait that raises the odds most in worst."))
  w <- G$worst
  top <- names(which.max(exp_odds[-1]))
  if (!identical(unname(as.character(w)), top)) return(.say(FALSE, paste0("'", paste(w, collapse = " "), "' is not the trait with the largest odds ratio. Ignore the intercept.")))
  .say(TRUE, sprintf("Each extra complaint multiplies the odds of leaving by %.2f. A loyalty seal multiplies them by %.2f.", exp_odds[["complaints"]], exp_odds[["loyaltyyes"]]))
}
.s3c5 <- function() {
  L <- G$guild
  if (is.null(L$risk)) return(.say(FALSE, "Add a column called risk to guild with the predicted probabilities."))
  exp_risk <- predict(.s3model(), type = "response")
  if (!isTRUE(all.equal(as.numeric(L$risk), as.numeric(exp_risk), tolerance = 1e-6)))
    return(.say(FALSE, "risk should be probabilities between 0 and 1. Use type = \"response\" in predict()."))
  if (!.has("save_list")) return(.say(FALSE, "Store the 20 customers with the highest risk in save_list."))
  top20 <- .GUILD$customer_id[order(exp_risk, decreasing = TRUE)][1:20]
  s <- G$save_list
  if (length(s) != 20) return(.say(FALSE, sprintf("save_list has %d names. The guild can only visit 20.", length(s))))
  if (!setequal(as.character(s), top20)) return(.say(FALSE, "Those are not the 20 riskiest customers. Sort by risk, from high to low."))
  .say(TRUE, sprintf("Twenty names on the scroll. Their average risk of leaving is %.0f%%. The guild's average is %.0f%%.", 100 * mean(sort(exp_risk, decreasing = TRUE)[1:20]), 100 * mean(exp_risk)))
}

## ---------- Session 4: The Tower of Seasons (time series) ----------
.setup_s4 <- function() {
  G <<- new.env(parent = globalenv())
  set.seed(1977)
  n <- 72
  t <- 1:n
  m <- ((t - 1) %% 12) + 1
  season <- c(38, 30, 18, 4, -10, -22, -28, -24, -10, 6, 22, 36)
  almanac <- data.frame(t = t, year = 1977 + (t - 1) %/% 12,
                        month = factor(month.abb[m], levels = month.abb))
  almanac$oil_barrels <- round(200 + 1.6 * t + season[m] + rnorm(n, 0, 8))
  .ALM <<- almanac
  assign("almanac", almanac, envir = G)
  invisible(TRUE)
}
.s4fit <- function() lm(oil_barrels ~ t + month, data = .ALM)
.s4c1 <- function(nimg) {
  src <- if (exists(".src")) .src else ""
  if (nimg < 1) return(.say(FALSE, "No vision appeared. Use plot() to draw the almanac."))
  if (!grepl("oil_barrels", src)) return(.say(FALSE, "Plot oil_barrels over time."))
  if (!grepl("type\\s*=\\s*[\"']l[\"']", src)) return(.say(FALSE, "Dots hide the rhythm. Use type = \"l\" to draw a line."))
  .say(TRUE, "A rising line with a wave every year. Two patterns at once: a trend and a season.")
}
.s4c2 <- function() {
  if (!.has("by_month")) return(.say(FALSE, "Store the average per month in by_month."))
  exp <- tapply(.ALM$oil_barrels, .ALM$month, mean)
  v <- G$by_month
  if (length(v) != 12 || !isTRUE(all.equal(as.numeric(v), as.numeric(exp)))) return(.say(FALSE, "by_month should hold the mean of oil_barrels for each month."))
  if (!.has("peak_month")) return(.say(FALSE, "Store the name of the busiest month in peak_month."))
  pk <- names(which.max(exp))
  if (!identical(unname(as.character(G$peak_month)), pk)) return(.say(FALSE, "That is not the month with the highest average. Use names(which.max(...))."))
  .say(TRUE, sprintf("%s is the peak, with %.0f barrels on average. %s is the quietest, with %.0f.", pk, max(exp), names(which.min(exp)), min(exp)))
}
.s4c3 <- function(nimg) {
  A <- G$almanac
  if (is.null(A$ma12)) return(.say(FALSE, "Add a column ma12 to almanac with the 12-month moving average."))
  exp <- as.numeric(stats::filter(.ALM$oil_barrels, rep(1 / 12, 12), sides = 2))
  if (!isTRUE(all.equal(as.numeric(A$ma12), exp))) return(.say(FALSE, "ma12 is not a 12-month moving average. Average 12 neighbours, each with weight 1/12."))
  if (nimg < 1) return(.say(FALSE, "The average is right. Now draw it: plot the oil, then add the average with lines()."))
  .say(TRUE, "The season melts away and the trend remains. Twelve months always contain every season exactly once.")
}
.s4c4 <- function() {
  if (!.has("fit")) return(.say(FALSE, "Store your model in fit."))
  f <- G$fit
  if (!inherits(f, "lm")) return(.say(FALSE, "fit should come from lm()."))
  have <- attr(terms(f), "term.labels")
  if (!all(c("t", "month") %in% have)) return(.say(FALSE, "The model needs both t (the trend) and month (the season)."))
  if (!.has("growth")) return(.say(FALSE, "Store the coefficient of t in growth."))
  g <- as.numeric(G$growth)
  exp <- coef(.s4fit())[["t"]]
  if (length(g) != 1 || !isTRUE(all.equal(g, exp))) return(.say(FALSE, "growth should be the coefficient of t: coef(fit)[\"t\"]."))
  .say(TRUE, sprintf("The tower burns %.2f more barrels each month than the month before, on top of the seasons. That's about %.0f more per year.", exp, 12 * exp))
}
.s4c5 <- function() {
  if (!.has("forecast")) return(.say(FALSE, "Store the 12 predictions in forecast."))
  fut <- data.frame(t = 73:84, month = factor(month.abb, levels = month.abb))
  exp <- predict(.s4fit(), newdata = fut)
  fc <- G$forecast
  if (length(fc) != 12 || !isTRUE(all.equal(as.numeric(fc), as.numeric(exp)))) return(.say(FALSE, "forecast should be predict(fit, newdata = future) for months 73 to 84."))
  if (!.has("order_total")) return(.say(FALSE, "Store the total of the forecast in order_total."))
  if (!isTRUE(all.equal(as.numeric(G$order_total), sum(exp)))) return(.say(FALSE, "order_total should be the sum of the 12 forecasts."))
  .say(TRUE, sprintf("Order %.0f barrels for 1983. The busiest month will be %s, with about %.0f.", sum(exp), month.abb[which.max(exp)], max(exp)))
}

## ---------- Session 5: The Overfitting Hydra (validation) ----------
.setup_s5 <- function() {
  G <<- new.env(parent = globalenv())
  set.seed(1985)
  n <- 60
  brews <- data.frame(moonleaf = round(runif(n, 0, 10), 1))
  noise <- c("troll_sweat", "newt_eyes", "mandrake", "frost_salt", "ember_dust", "bog_water",
             "raven_quill", "wolfsbane", "glowcap", "ashroot", "dragonmoss", "toadstool",
             "fairy_ink", "nightshade", "pixie_dust", "kraken_ink", "sunpetal", "saltpeter",
             "goblin_ash", "owl_feather", "moss_water", "bone_meal", "starlight", "thistle")
  for (v in noise) brews[[v]] <- round(runif(n, 0, 10), 1)
  brews$potency <- round(10 + 3 * brews$moonleaf + rnorm(n, 0, 3), 1)
  .BREWS <<- brews
  assign("brews", brews, envir = G)
  invisible(TRUE)
}
.s5c1 <- function() {
  if (!.has("m_simple")) return(.say(FALSE, "Store the one-ingredient model in m_simple."))
  m <- G$m_simple
  if (!inherits(m, "lm") || !identical(attr(terms(m), "term.labels"), "moonleaf")) return(.say(FALSE, "m_simple should be lm(potency ~ moonleaf, data = brews)."))
  r <- .num1("r2_simple", summary(lm(potency ~ moonleaf, data = .BREWS))$r.squared, "Take r.squared from summary(m_simple).")
  if (!is.null(r)) return(r)
  .say(TRUE, sprintf("Moonleaf alone explains %.0f%% of the variation in potency.", 100 * G$r2_simple))
}
.s5c2 <- function() {
  if (!.has("m_all")) return(.say(FALSE, "Store the everything model in m_all."))
  m <- G$m_all
  if (!inherits(m, "lm") || length(attr(terms(m), "term.labels")) != ncol(.BREWS) - 1) return(.say(FALSE, "m_all should use every ingredient. The dot in potency ~ . means “all other columns”."))
  exp <- summary(lm(potency ~ ., data = .BREWS))$r.squared
  r <- .num1("r2_all", exp, "Take r.squared from summary(m_all).")
  if (!is.null(r)) return(r)
  .say(TRUE, sprintf("R² rose from %.2f to %.2f. %d ingredients that do nothing still made the model look better.", summary(lm(potency ~ moonleaf, data = .BREWS))$r.squared, exp, ncol(.BREWS) - 2))
}
.s5c3 <- function() {
  if (!.has("train") || !.has("test")) return(.say(FALSE, "Create both train and test."))
  tr <- G$train; te <- G$test
  if (!is.data.frame(tr) || !is.data.frame(te)) return(.say(FALSE, "train and test should be data frames."))
  if (nrow(tr) != 40 || nrow(te) != 20) return(.say(FALSE, sprintf("train has %d rows and test has %d. Aim for 40 and 20.", nrow(tr), nrow(te))))
  ids <- c(rownames(tr), rownames(te))
  if (any(duplicated(ids)) || !setequal(ids, rownames(.BREWS))) return(.say(FALSE, "Every brew must be in exactly one of train or test. Use idx for one and -idx for the other."))
  .say(TRUE, "40 brews to learn from. 20 brews locked away, which the models will never see while learning.")
}
.rmse_ <- function(a, b) sqrt(mean((a - b)^2))
.s5c4 <- function() {
  tr <- G$train; te <- G$test
  s <- lm(potency ~ moonleaf, data = tr); a <- lm(potency ~ ., data = tr)
  es <- .rmse_(te$potency, predict(s, te)); ea <- .rmse_(te$potency, predict(a, te))
  r <- .num1("rmse_simple", es, "Fit potency ~ moonleaf on train, predict on test, and compare with test$potency.")
  if (!is.null(r)) return(r)
  r <- .num1("rmse_all", ea, "Fit potency ~ . on train, predict on test, and compare with test$potency.")
  if (!is.null(r)) return(r)
  .say(TRUE, sprintf("On unseen brews, the simple model misses by %.1f on average. The everything model misses by %.1f.", es, ea))
}
.s5c5 <- function() {
  tr <- G$train; te <- G$test
  a <- lm(potency ~ ., data = tr); s <- lm(potency ~ moonleaf, data = tr)
  etr <- .rmse_(tr$potency, fitted(a))
  r <- .num1("train_all", etr, "Compute the RMSE of m_all on the training brews: compare train$potency with fitted values.")
  if (!is.null(r)) return(r)
  es <- .rmse_(te$potency, predict(s, te)); ea <- .rmse_(te$potency, predict(a, te))
  best <- if (es < ea) "simple" else "all"
  if (!.has("champion")) return(.say(FALSE, "Store your choice, \"simple\" or \"all\", in champion."))
  if (!identical(G$champion, best)) return(.say(FALSE, "The Hydra laughs. Judge the models by their test error, not their training error."))
  .say(TRUE, sprintf("The everything model misses by only %.1f on brews it has seen, but by %.1f on new ones. The simple model wins where it counts.", etr, ea))
}

## ---------- Session 6: The Guild Census (hierarchical clustering) ----------
.setup_s6 <- function() {
  G <<- new.env(parent = globalenv())
  set.seed(1986)
  mk <- function(n, v, b, l, m) data.frame(
    visits_per_month = pmax(0, round(rnorm(n, v[1], v[2]), 1)),
    basket_gold = pmax(1, round(rnorm(n, b[1], b[2]))),
    luxury_share = pmin(1, pmax(0, round(rnorm(n, l[1], l[2]), 2))),
    months_member = pmax(1, round(rnorm(n, m[1], m[2]))))
  members <- rbind(
    mk(26, c(9, 1.6), c(18, 6), c(0.08, 0.05), c(40, 12)),
    mk(16, c(2.5, 0.9), c(140, 28), c(0.7, 0.1), c(55, 14)),
    mk(18, c(3.5, 1.1), c(45, 12), c(0.25, 0.08), c(5, 3)))
  members <- members[sample(nrow(members)), ]
  rownames(members) <- NULL
  members <- cbind(member = sprintf("M%02d", seq_len(nrow(members))), members, stringsAsFactors = FALSE)
  .MEM <<- members
  assign("members", members, envir = G)
  invisible(TRUE)
}
.s6vars <- c("visits_per_month", "basket_gold", "luxury_share", "months_member")
.s6tree <- function() hclust(dist(scale(.MEM[, .s6vars])), method = "ward.D2")
.s6c1 <- function(nimg) {
  src <- if (exists(".src")) .src else ""
  if (nimg < 1) return(.say(FALSE, "No vision appeared. Plot basket_gold against visits_per_month."))
  if (!grepl("visits_per_month", src) || !grepl("basket_gold", src)) return(.say(FALSE, "Plot basket_gold against visits_per_month."))
  .say(TRUE, "Three clouds of members. Frequent small spenders, rare big spenders, and a group in between.")
}
.s6c2 <- function() {
  if (!.has("X")) return(.say(FALSE, "Store the scaled numbers in X."))
  X <- G$X
  if (!is.matrix(X) || ncol(X) != 4) return(.say(FALSE, "X should hold the 4 numeric columns, passed through scale()."))
  if (!isTRUE(all.equal(unname(colMeans(X)), rep(0, 4), tolerance = 1e-6)) || !isTRUE(all.equal(unname(apply(X, 2, sd)), rep(1, 4), tolerance = 1e-6)))
    return(.say(FALSE, "The columns aren't standardised yet. Wrap them in scale()."))
  exp <- scale(.MEM[, .s6vars])
  if (!isTRUE(all.equal(unname(X), unname(exp)))) return(.say(FALSE, "Use exactly these columns: visits_per_month, basket_gold, luxury_share, months_member."))
  .say(TRUE, "Every column now has mean 0 and standard deviation 1. A gold coin and a visit finally weigh the same.")
}
.s6c3 <- function(nimg) {
  if (!.has("tree")) return(.say(FALSE, "Store the result of hclust() in tree."))
  t <- G$tree
  if (!inherits(t, "hclust")) return(.say(FALSE, "tree should come from hclust()."))
  if (!identical(t$method, "ward.D2")) return(.say(FALSE, "Use method = \"ward.D2\"."))
  if (!isTRUE(all.equal(t$height, .s6tree()$height))) return(.say(FALSE, "The tree doesn't match. Build it from dist(X), with X the scaled data."))
  if (nimg < 1) return(.say(FALSE, "The tree is grown. Now draw it with plot(tree)."))
  .say(TRUE, "The family tree of the guild. Members who shop alike join low down. Very different groups only join at the top.")
}
.s6c4 <- function() {
  M <- G$members
  if (is.null(M$segment)) return(.say(FALSE, "Add a column called segment to members."))
  exp <- cutree(.s6tree(), k = 3)
  if (length(unique(M$segment)) != 3) return(.say(FALSE, sprintf("You made %d segments. Cut the tree into 3.", length(unique(M$segment)))))
  if (!isTRUE(all.equal(as.integer(M$segment), as.integer(exp)))) return(.say(FALSE, "Those segments don't match the tree. Use cutree(tree, k = 3)."))
  tb <- table(exp)
  .say(TRUE, sprintf("Three segments of %s members. The DM nods: the cut sits where the branches are longest.", paste(as.integer(tb), collapse = ", ")))
}
.s6c5 <- function() {
  if (!.has("profile")) return(.say(FALSE, "Store the averages per segment in profile."))
  pr <- G$profile
  if (!is.data.frame(pr) || is.null(pr$segment) || nrow(pr) != 3) return(.say(FALSE, "profile should be a data frame with one row per segment, from aggregate()."))
  M <- .MEM; M$segment <- cutree(.s6tree(), k = 3)
  exp <- aggregate(cbind(visits_per_month, basket_gold, luxury_share, months_member) ~ segment, data = M, FUN = mean)
  for (v in .s6vars) if (is.null(pr[[v]]) || !isTRUE(all.equal(pr[[v]][order(pr$segment)], exp[[v]]))) return(.say(FALSE, paste0("The average of ", v, " per segment is missing or wrong.")))
  if (!.has("nobles")) return(.say(FALSE, "Store the number of the segment with the highest luxury_share in nobles."))
  top <- exp$segment[which.max(exp$luxury_share)]
  if (!isTRUE(as.numeric(G$nobles) == top)) return(.say(FALSE, "That is not the segment with the highest luxury_share."))
  .say(TRUE, sprintf("Segment %d are the Nobles: about %.0f gold per basket, %.0f%% luxury goods, but only %.1f visits a month.", top, exp$basket_gold[top], 100 * exp$luxury_share[top], exp$visits_per_month[top]))
}

## ---------- Story Mode (stories written by a human DM) ----------
.setup_story <- function(csv, name) {
  G <<- new.env(parent = globalenv())
  if (nzchar(csv)) {
    d <- utils::read.csv(text = csv, stringsAsFactors = FALSE, check.names = TRUE)
    assign(if (nzchar(name)) make.names(name) else "data", d, envir = G)
  }
  invisible(TRUE)
}
.check_story <- function(expr, fail_msg, nimg) {
  if (!nzchar(trimws(expr))) return(.say(TRUE, "The DM set no check for this step. Well cast."))
  env <- new.env(parent = G)
  env$n_plots <- nimg
  v <- tryCatch(eval(parse(text = expr), env), error = function(e) structure(conditionMessage(e), class = "check_error"))
  if (inherits(v, "check_error")) return(.say(FALSE, paste0("Not yet. (The check needs something that isn't there yet: ", v, ")")))
  if (isTRUE(v)) return(.say(TRUE, "The DM nods. That's exactly it."))
  if (is.character(v) && length(v) == 1) return(.say(FALSE, v))
  .say(FALSE, if (nzchar(fail_msg)) fail_msg else "Not quite. Read the task again, or roll for a hint.")
}

function drawSprite(canvas, name, opts = {}) {
  const sp = SPRITES[name]; if (!canvas || !sp) return;
  const n = 16, scale = Math.floor(canvas.width / n);
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sp.px.forEach((row, j) => [...row.padEnd(n, ".")].slice(0, n).forEach((ch, i) => {
    if (ch === ".") return;
    ctx.fillStyle = opts.grey ? "#4a4048" : (sp.pal[ch] || "#000");
    ctx.fillRect(i * scale, j * scale, scale, scale);
  }));
}

/* Safe formatting for text written by DMs: everything is escaped, then `code`, **bold** and *italic* are allowed. */
function fmt(text) {
  return esc(text || "")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
}
const paras = (text) => String(text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean).map(fmt);

/* Share codes: "HV1." + base64url(gzip(JSON)) */
async function encodeStory(story) {
  const bytes = new TextEncoder().encode(JSON.stringify(story));
  const gz = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
  let bin = ""; const u = new Uint8Array(gz);
  for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return "HV1." + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function decodeStory(code) {
  code = String(code || "").trim();
  if (code.startsWith("{")) return validateStory(JSON.parse(code));
  if (!code.startsWith("HV1.")) throw new Error("This doesn't look like a story code. It should start with HV1.");
  const b64 = code.slice(4).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
  const u = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const txt = await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return validateStory(JSON.parse(txt));
}
function validateStory(st) {
  if (!st || typeof st !== "object" || !Array.isArray(st.chapters) || !st.chapters.length) throw new Error("This story has no chapters.");
  const s = (v, n = 4000) => String(v ?? "").slice(0, n);
  return {
    format: 1,
    title: s(st.title, 80) || "Untitled story", author: s(st.author, 60), npc: STORY_NPCS.includes(st.npc) ? st.npc : "thessaly",
    summary: s(st.summary, 200), intro: s(st.intro), ending: s(st.ending),
    dataset: { name: s(st.dataset?.name, 40) || "data", csv: s(st.dataset?.csv, 2000000) },
    chapters: st.chapters.slice(0, 15).map((c) => ({
      title: s(c.title, 80) || "Untitled chapter", story: s(c.story), task: s(c.task, 1500), starter: s(c.starter, 6000),
      check: s(c.check, 3000), fail: s(c.fail, 400), nudge: s(c.nudge, 800), clue: s(c.clue, 800), answer: s(c.answer, 6000),
      lesson: s(c.lesson, 1500), boss: !!c.boss, bossName: s(c.bossName, 60), bossArt: STORY_BOSSES.includes(c.bossArt) ? c.bossArt : "goblin",
      question: s(c.question, 600), options: s(c.options, 1500), why: s(c.why, 800),
    })),
  };
}
async function storyId(story) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(JSON.stringify(story)));
  return "st_" + [...new Uint8Array(buf)].slice(0, 6).map((b) => b.toString(16).padStart(2, "0")).join("");
}

      id: i + 1, short: `${ROMAN[i] || i + 1} · ${c.title}`.slice(0, 32), title: `Chapter ${ROMAN[i] || i + 1} · ${c.title}`,
      stat: STAT_ROTA[i % 4], graphics: true, npc: st.npc,
      story: [...(i === 0 ? paras(st.intro) : []), ...paras(c.story)],
      task: fmt(c.task), starter: c.starter || "# Write your spell here\n",
      lesson: c.lesson ? `<b>Lesson:</b> ${fmt(c.lesson)}` : "<b>Well done.</b>",
      enemy: c.boss ? { name: c.bossName || "The Shadow", hp: 10, note: "Set by your DM.", art: c.bossArt } : null,
      check: c.check, fail: c.fail,
    })),
    epilogue: () => paras(st.ending || "The story ends here. Thanks for playing.").map((p) => `<p>${p}</p>`).join(""),
    summary: st.summary ? fmt(st.summary) : "",
  };
}
function storyHelp(sid, chId) {
  const c = S.stories?.[sid]?.chapters?.[chId - 1]; if (!c) return null;
  if (!c.nudge && !c.clue && !c.answer) return null;
  return { nudge: fmt(c.nudge || "Re-read the task. The spellbook can help."), clue: fmt(c.clue || c.nudge || "Search the spellbook for the key word in the task."), answer: c.answer || "", why: fmt(c.lesson || "") };
}
function storyInterp(sid, chId) {
  const c = S.stories?.[sid]?.chapters?.[chId - 1]; if (!c || !c.question || !c.options) return null;
  const lines = c.options.split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 6);
  if (lines.length < 2 || !lines.some((l) => l.startsWith("*"))) return null;
  return {
    q: fmt(c.question),
    options: lines.map((l, k) => {
      const ok = l.startsWith("*");
      return { v: String.fromCharCode(97 + k), t: l.replace(/^\*\s*/, ""), ok, why: ok ? fmt(c.why || "That's right.") : "Not this one. Think about what the result really shows." };
    }),
  };
}

async function addStory(st) {

}
async function showShare(id) {
  const st = S.stories[id]; const box = $("sharebox"); if (!st || !box) return;
  const code = await encodeStory(st);
  const link = location.protocol.startsWith("http") && !window.claude?.use ? `${location.origin}${location.pathname}?story=${code}` : "";
  box.hidden = false;
  box.innerHTML = `<div class="dm-label">SHARE “${esc(st.title)}”</div>
    <p class="fbintro">Send this code to your players. They paste it in <b>Load a story</b>. It contains the whole story, data included (${Math.round(code.length / 1024)} KB).</p>

    <div class="actions" style="padding:8px 0 0;border:0">
      <button class="btn" id="copyCode">Copy code</button>
      ${link && link.length < 8000 ? `<button class="btn ghost" id="copyLink">Copy a direct link</button>` : ""}
      <span class="fbstatus" id="shareStatus" role="status"></span>
    </div>`;
  const copy = async (text, what) => { try { await navigator.clipboard.writeText(text); $("shareStatus").textContent = `${what} copied.`; } catch (e) { $("shareCode").select(); $("shareStatus").textContent = "Copy was blocked. Select the code and copy it by hand."; } };
  $("copyCode").addEventListener("click", () => copy(code, "Code"));
  if ($("copyLink")) $("copyLink").addEventListener("click", () => copy(link, "Link"));
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function testChapter(i) {

}

const FUTURE = [];

/* ---------- State ---------- */
const KEY = "blighted-harvest-r2";
const freshProgress = () => ({ step: 1, code: {}, solved: {}, guesses: {}, fails: {}, tier: {}, revealed: {}, done: false });
const DEFAULT = { name: "", cls: "", xp: 0, level: 1, stats: { wrangling: 10, sight: 10, modeling: 10, wisdom: 10 }, rolls: [], view: "prologue", current: null, progress: {} };
let S = JSON.parse(JSON.stringify(DEFAULT));
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(raw)); return; }
    const old = localStorage.getItem("blighted-harvest-r1");
    if (old) {
      const o = JSON.parse(old);
      Object.assign(S, { name: o.name || "", cls: o.cls || "", xp: o.xp || 0, level: o.level || 1, stats: o.stats || S.stats, rolls: o.rolls || [] });
      if (o.step > 0) {
        S.progress.s1 = { step: Math.min(o.step, 6), code: o.code || {}, solved: o.solved || {}, guesses: o.guess ? { 4: o.guess } : {}, done: o.step >= 6 };
        S.view = "map";
      }
    }
  } catch (e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const P = (sid) => {
  const p = (S.progress[sid] = S.progress[sid] || freshProgress());
  p.fails = p.fails || {}; p.tier = p.tier || {}; p.revealed = p.revealed || {}; p.interp = p.interp || {};
  return p;
};
const sessionOf = (sid) => SESSIONS.find((x) => x.id === sid) || (S.stories?.[sid] ? storyToSession(sid, S.stories[sid]) : null);
const helpFor = (sess, st) => HELP[sess.id]?.[st.id] || (sess.story ? storyHelp(sess.id, st.id) : null);
const interpFor = (sess, st) => INTERPRET[sess.id]?.[st.id] || (sess.story ? storyInterp(sess.id, st.id) : null);
const REQUIRES = { s2: "s1", s3: "s2", s6: "s3", s4: "s6", s5: "s4" };
function sessionState(i) {
  const sess = SESSIONS[i];
  if (S.progress[sess.id]?.done) return "done";
  const req = REQUIRES[sess.id];
  const started = (S.progress[sess.id]?.step || 1) > 1;
  if (!req || started || S.progress[req]?.done) return "open";
  return "locked";
}
const recommended = () => (S.newToR && !S.progress.s0?.done ? "s0" : SESSIONS.find((x, i) => !x.optional && sessionState(i) === "open")?.id);

let webR = null, rReady = false, preparedFor = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Sidebar ---------- */
function renderSheet() {
  const c = CLASSES.find((x) => x.id === S.cls);
  const xpInLevel = S.xp % 200;
  $("sheet").innerHTML = `
    <div class="sheethead"><canvas class="heroart" id="heroArt" width="64" height="64" aria-hidden="true"></canvas>
    <div><h3>${S.name ? esc(S.name) : "Unnamed Adventurer"}</h3>
    <div class="sub">${c ? c.name : "Choose a class"} · Level ${S.level}</div></div></div>
    <div class="stats">${Object.keys(STAT_NAMES).map((k) => `<div class="stat"><small>${STAT_NAMES[k]}</small><b>${S.stats[k]}</b></div>`).join("")}</div>
    <div class="xpbar"><div style="width:${(xpInLevel / 200) * 100}%"></div></div>
    <div class="xptext"><span>XP ${S.xp}</span><span>next level at ${S.level * 200}</span></div>`;
  if (c) drawSprite($("heroArt"), HERO_SPRITE[c.id]); else $("heroArt").style.visibility = "hidden";
}

let spellQuery = "";
function renderSpells() {
  const q = spellQuery.trim().toLowerCase();
  const match = (sp) => !q || sp.join(" ").toLowerCase().includes(q);
  let total = 0;
  const groups = SPELLBOOK.map((g) => {
    const hits = g.spells.filter(match);
    total += hits.length;
    if (!hits.length) return "";
    return `<details class="spellcat" ${q ? "open" : ""}><summary>${esc(g.cat)} <span>${hits.length}</span></summary>${hits.map(([sig, what, ex]) =>
      `<div class="spell"><div class="sig">${esc(sig)}</div><div class="what">${esc(what)}</div><div class="ex">${esc(ex)}</div></div>`).join("")}</details>`;
  }).join("");
  $("spells").innerHTML = groups || `<div class="what" style="font-size:15px;padding:8px 0">No spell matches “${esc(spellQuery)}”. Try another word, like mean, plot or test.</div>`;
}

function renderDiceLog() {
  if (!S.rolls.length) { $("diceLog").textContent = "Dice log: no rolls yet. A fair d20 averages 10.5."; return; }
  const avg = S.rolls.reduce((a, b) => a + b, 0) / S.rolls.length;
  $("diceLog").textContent = `Dice log: ${S.rolls.length} roll${S.rolls.length > 1 ? "s" : ""}, average ${avg.toFixed(1)} (a fair d20 averages 10.5).`;
}

/* ---------- Main views ---------- */
function render() {
  renderSheet(); renderSpells(); renderDiceLog();
  $("rollResult").textContent = "Roll 10 or more for the next hint. Chance: 11 in 20, or 55%.";
  renderModes();
  if (S.view === "prologue" || !S.name || !S.cls) return renderPrologue();
  if (S.view === "stories") return renderStories();
  if (S.view === "editor") {
    if (!ED) { try { const d = JSON.parse(localStorage.getItem(KEY + "-draft") || "null"); if (d) { ED = d.ED; edId = d.id; } } catch (e) {} }
    if (ED) return renderEditor();
    S.view = "stories"; return renderStories();
  }
  if (S.view === "map" || !S.current || !sessionOf(S.current)) return renderMap();
  const sess = sessionOf(S.current);
  const prog = P(sess.id);
  renderTrack(sess, prog);
  if (prog.step > sess.chapters.length) return renderEpilogue(sess, prog);
  renderChapter(sess, prog);
}

function renderTrack(sess, prog) {
  const items = sess.chapters.map((c) => `<span class="${c.id < prog.step ? "done" : c.id === prog.step ? "now" : ""}">${c.short}</span>`);
  items.push(`<span class="${prog.step > sess.chapters.length ? "now" : ""}">Epilogue</span>`);
  $("track").innerHTML = `<button class="backlink" id="toMap">${sess.story ? (prog.testFrom ? "← Back to editor" : "← Story Mode") : "← Map"}</button>` + items.join("");
  $("toMap").addEventListener("click", goMap);
}

function renderModes() {
  const nav = $("modes"); if (!nav) return;
  const hasHero = S.name && S.cls && S.view !== "prologue";
  nav.hidden = !hasHero;
  const inStory = S.view === "stories" || S.view === "editor" || (S.view === "session" && sessionOf(S.current)?.story);
  nav.querySelectorAll("[data-mode]").forEach((b) => { const on = (b.dataset.mode === "stories") === !!inStory; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
}
function goMap() {
  const sess = sessionOf(S.current);
  if (sess && sess.story) {
    const prog = P(sess.id);
    if (prog.testFrom) { delete S.stories.st_test; delete S.progress.st_test; S.current = null; S.view = "editor"; save(); render(); return; }
    S.view = "stories"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  } S.view = "map"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

    s3: (x, y) => `<g transform="translate(${x} ${y - 58})"><g class="bob"><path d="M-22 6 L22 6 L15 16 L-15 16 Z" fill="#6b4a2a" stroke="${L}" stroke-width="2"/><line x1="0" y1="6" x2="0" y2="-26" stroke="${L}" stroke-width="2.5"/><path d="M2 -24 L18 2 L2 2 Z" fill="#efe6cf" stroke="${L}" stroke-width="2"/><path d="M-2 -20 L-16 2 L-2 2 Z" fill="#d9a441" stroke="${L}" stroke-width="2"/><path d="M0 -26 L10 -23 L0 -20 Z" fill="#7a2418"/></g></g>`,
    s4: (x, y) => `<g transform="translate(${x} ${y - 64})"><path d="M-8 20 L-5 -14 L5 -14 L8 20 Z" fill="#efe6cf" stroke="${L}" stroke-width="2"/><rect x="-6" y="-4" width="12" height="5" fill="#7a2418"/><rect x="-6" y="8" width="12" height="5" fill="#7a2418"/><rect x="-7" y="-22" width="14" height="8" fill="#3b2a1a"/><circle cx="0" cy="-18" r="4" fill="#ffd34d" class="glow"/><circle cx="0" cy="-18" r="14" fill="#ffd34d" opacity=".25" class="glow"/><path d="M-9 -22 L0 -30 L9 -22 Z" fill="#7a2418" stroke="${L}" stroke-width="2"/></g>`,

    s5: (x, y) => `<g transform="translate(${x} ${y - 60})" class="sway">${[-14, 0, 14].map((dx, k) => `<path d="M${dx} 16 Q${dx - 8} 2 ${dx} -8 Q${dx + 6} -16 ${dx + 2} -20" fill="none" stroke="#3e6b5a" stroke-width="6" stroke-linecap="round"/><circle cx="${dx + 3}" cy="-21" r="4.5" fill="#3e6b5a"/><circle cx="${dx + 4}" cy="-22" r="1.3" fill="#ffd34d"/>`).join("")}<path d="M-26 16 Q0 8 26 16" fill="#7fa0a8" stroke="#5d7270" stroke-width="2"/></g>`,
  };
  const revealed = S.revealed || [];
  const newly = [];
  const fog = (x, y, clearing) => `<g class="fog ${clearing ? "clearing" : ""}" aria-hidden="true">${[[-60, -30, 46], [-10, -50, 52], [45, -25, 48], [-40, 25, 44], [20, 30, 50], [70, 15, 36], [-80, 10, 30]].map(([dx, dy, r]) => `<circle cx="${x + dx}" cy="${y + dy}" r="${r}"/>`).join("")}</g>`;
  const nodes = sites.map((s, i) => {
    const [x, y] = pos[i];
    const lab = s.state === "locked" && !s.id ? "?" : s.num;
    const opt = s.id === "s0" && s.state !== "done";
    const sub = s.state === "done" ? "✓ complete" : opt ? "optional" : s.state === "open" ? "▶ play" : s.id ? "locked" : "coming soon";
    const locked = s.state === "locked";
    const clearing = !locked && s.id && !["s0", "s1"].includes(s.id) && !revealed.includes(s.id);
    if (clearing) newly.push(s.id);
    const icon = ICONS[s.id] ? `<g transform="translate(${x} ${y - 40}) scale(1.25) translate(${-x} ${-(y - 40)})">${ICONS[s.id](x, y)}</g>` : "";
    return `${icon}<g class="node ${s.state}" ${s.id && s.state !== "locked" ? `tabindex="0" role="button" data-session="${s.id}" aria-label="${esc(s.place)}: ${esc(s.title)}, ${sub}"` : `aria-hidden="true"`}>
      ${s.state === "open" && s.id === rec ? `<circle class="pulse" cx="${x}" cy="${y}" r="26"/>` : ""}

    <text class="mapnote" x="520" y="628">the Grey Sea</text>

    <path d="M620 0 C 560 120, 470 180, 440 275 S 330 380, 250 455 S 200 560, 190 595" fill="none" stroke="#b9d0d2" stroke-width="6" stroke-linecap="round"/>
    ${mountains}${trees}${reeds}
    <path d="M70 200 q40 -30 90 -10 q40 20 80 -5" fill="none" stroke="#6b7d4a" stroke-width="2" stroke-dasharray="3 5"/>

    <g transform="translate(940 520)"><circle r="28" fill="none" stroke="#6b5636" stroke-width="1.5"/><path d="M0 -26 L6 0 L0 26 L-6 0 Z" fill="#7a2418"/><text x="0" y="-32" text-anchor="middle" class="mapnote" style="font-style:normal;font-family:var(--display)">N</text></g>
    ${nodes}
